[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meetly-stt-research"
version = "0.1.0"
description = "Research Benchmark Framework cho Subsystem STT của dự án Meetly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.40.0",
    "psutil>=5.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
